<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Brightness">
  <!-- Landing page favicon: the same sun glyph as the application icon, in the
       accent colour so that it stays legible on both light and dark browser
       chrome. The application icons keep their monochrome black. -->
  <rect width="512" height="512" rx="96" fill="#0f1115" />
  <g fill="#ffb347">
    <g transform="translate(256 256)">
      <rect x="-14" y="-208" width="28" height="66" rx="14" />
      <rect x="-14" y="-208" width="28" height="66" rx="14" transform="rotate(45)" />
      <rect x="-14" y="-208" width="28" height="66" rx="14" transform="rotate(90)" />
      <rect x="-14" y="-208" width="28" height="66" rx="14" transform="rotate(135)" />
      <rect x="-14" y="-208" width="28" height="66" rx="14" transform="rotate(180)" />
      <rect x="-14" y="-208" width="28" height="66" rx="14" transform="rotate(225)" />
      <rect x="-14" y="-208" width="28" height="66" rx="14" transform="rotate(270)" />
      <rect x="-14" y="-208" width="28" height="66" rx="14" transform="rotate(315)" />
      <circle cx="0" cy="0" r="88" />
    </g>
  </g>
</svg>
