<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brightness Control</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The Tauri window is transparent and frameless; the panel is the app UI. -->
    <main class="card" id="card">

      <!-- ============ MAIN VIEW ============ -->
      <section class="view active" id="view-main">
        <!-- Header is the drag region (Tauri 2 data-tauri-drag-region).
             Interactive children (buttons) are not draggable. -->
        <header class="header" data-tauri-drag-region>
          <h1 class="title">Display brightness</h1>
          <button
            class="settings-btn"
            id="open-settings-btn"
            type="button"
            title="Settings"
            aria-label="Open settings"
          >
            <!-- Inline gear/cog SVG (Feather "settings" icon) -->
            <svg
              class="gear-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </button>
        </header>

        <!-- Monitor sections are injected here by main.js -->
        <div class="monitors" id="monitor-list">
          <!-- placeholder until JS renders monitors -->
          <div class="monitor-placeholder">Loading monitors…</div>
        </div>
      </section>

      <!-- ============ SETTINGS VIEW ============ -->
      <section class="view" id="view-settings">
        <header class="header" data-tauri-drag-region>
          <button
            class="back-btn"
            id="back-btn"
            type="button"
            title="Back"
            aria-label="Back to brightness"
          >
            <!-- Inline back-arrow SVG (Feather "arrow-left") -->
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back</span>
          </button>
          <h1 class="title">Settings</h1>
        </header>

        <div class="settings-body">
          <!-- Launch at login toggle -->
          <label class="setting-row">
            <span class="setting-label">Launch at login</span>
            <span class="switch">
              <input
                type="checkbox"
                class="switch-checkbox"
                id="toggle-login"
              />
              <span class="switch-slider"></span>
            </span>
          </label>

          <!-- DDC/CI toggle -->
          <label class="setting-row">
            <span class="setting-label">DDC/CI enabled</span>
            <span class="switch">
              <input
                type="checkbox"
                class="switch-checkbox"
                id="toggle-ddcci"
                checked
              />
              <span class="switch-slider"></span>
            </span>
          </label>

          <!-- Brightness step select -->
          <label class="setting-row">
            <span class="setting-label">Brightness step</span>
            <select class="step-select" id="step-select">
              <option value="1">1</option>
              <option value="5" selected>5</option>
              <option value="10">10</option>
            </select>
          </label>

          <!-- About section -->
          <div class="about">
            <div class="about-row">
              <span class="about-name" id="about-name">Brightness Control</span>
              <span class="about-version" id="about-version">v0.1.0</span>
            </div>
            <p class="about-credit">
              Author: marrionesa ·
              <a href="https://github.com/marrionesa" rel="noreferrer">
                github.com/marrionesa
              </a>
            </p>
            <p class="about-note">
              Brightness is controlled via the DDC/CI protocol over the
              display's data channel. Some monitors may not respond; in that
              case the slider will have no effect on the hardware.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
