<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Brightness Control tray icon — a modern monochrome sun glyph.
       Black (#1a1a1a) on transparent. Used as a template image on macOS
       (iconAsTemplate=true) so the system auto-adapts to light/dark mode. -->
  <g fill="#1a1a1a">
    <g transform="translate(256 256)">
      <!-- 8 rays, each a 28x76 rounded rectangle radiating from the center -->
      <rect x="-14" y="-232" width="28" height="76" rx="14"/>
      <rect x="-14" y="-232" width="28" height="76" rx="14" transform="rotate(45)"/>
      <rect x="-14" y="-232" width="28" height="76" rx="14" transform="rotate(90)"/>
      <rect x="-14" y="-232" width="28" height="76" rx="14" transform="rotate(135)"/>
      <rect x="-14" y="-232" width="28" height="76" rx="14" transform="rotate(180)"/>
      <rect x="-14" y="-232" width="28" height="76" rx="14" transform="rotate(225)"/>
      <rect x="-14" y="-232" width="28" height="76" rx="14" transform="rotate(270)"/>
      <rect x="-14" y="-232" width="28" height="76" rx="14" transform="rotate(315)"/>
      <!-- Center body of the sun -->
      <circle cx="0" cy="0" r="100"/>
    </g>
  </g>
</svg>
